<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>german2.html</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        .title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 3rem;
            opacity: 0.9;
        }
        
        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .link-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 2rem;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        
        .link-card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .link-icon {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 1rem;
        }
        
        .link-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .link-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .title { font-size: 2.2rem; }
            .links { flex-direction: column; align-items: center; }
            .link-card { min-width: 280px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">german2.html</h1>
        <p class="subtitle">Выберите способ изучения</p>
        
        <div class="links">
            <a href="german-flashcards.html" class="link-card">
                <span class="link-icon">🃏</span>
                <div class="link-title">Флэшкарты</div>
                <div class="link-desc">Интерактивные карточки</div>
            </a>
            
            <a href="german2.html" class="link-card">
                <span class="link-icon">🎯</span>
                <div class="link-title">Упражнения</div>
                <div class="link-desc">Тесты и задания</div>
            </a>
        </div>
    </div>
</body>
</html>
