<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Флэшкарты: Немецкие глаголы</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
            z-index: 10;
            position: relative;
        }
        
        .title {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.02em;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 400;
        }
        
        .flashcard-container {
            position: relative;
            z-index: 10;
            perspective: 1000px;
            margin-bottom: 2rem;
        }
        
        .flashcard {
            width: 400px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 8px 16px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .card-face:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 10px 20px rgba(0, 0, 0, 0.1);
        }
        
        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        
        .card-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .german-word {
            font-size: 2.5rem;
            font-weight: 600;
            color: #1a202c;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.02em;
        }
        
        .russian-word {
            font-size: 2rem;
            font-weight: 500;
            color: #2d3748;
            text-align: center;
            line-height: 1.3;
        }
        
        .click-hint {
            position: absolute;
            bottom: 1rem;
            font-size: 0.8rem;
            color: #a0aec0;
            font-family: 'JetBrains Mono', monospace;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            z-index: 10;
            position: relative;
        }
        
        .btn {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #4a5568;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .btn:hover {
            background: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .progress {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            z-index: 10;
            position: relative;
        }
        
        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin: 0.5rem auto;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0%;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            
            .title {
                font-size: 2.2rem;
            }
            
            .flashcard {
                width: 320px;
                height: 200px;
            }
            
            .german-word {
                font-size: 2rem;
            }
            
            .russian-word {
                font-size: 1.6rem;
            }
            
            .controls {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .progress-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">Немецкие глаголы</h1>
        <p class="subtitle">Интерактивные флэшкарты</p>
    </div>
    
    <div class="flashcard-container">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="card-label">Немецкий</div>
                <div class="german-word" id="german-word">fernsehen</div>
                <div class="click-hint">Нажмите для перевода</div>
            </div>
            <div class="card-face card-back">
                <div class="card-label">Перевод</div>
                <div class="russian-word" id="russian-word">смотреть телевизор</div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn" onclick="previousCard()">← Назад</button>
        <button class="btn" onclick="nextCard()">Далее →</button>
        <button class="btn" onclick="shuffleCards()">Перемешать</button>
        <button class="btn" onclick="resetProgress()">Сброс</button>
    </div>
    
    <div class="progress">
        <div id="progress-text">1 / 18</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <script>
        const words = [
            { german: "fernsehen", russian: "смотреть телевизор" },
            { german: "fertig sein", russian: "быть готовым" },
            { german: "morgen", russian: "завтра" },
            { german: "alle", russian: "все" },
            { german: "zufrieden", russian: "довольный, удовлетворённый" },
            { german: "hören", russian: "слушать" },
            { german: "fahren, er fährt", russian: "ехать, ездить" },
            { german: "reiten", russian: "ездить верхом" },
            { german: "singen", russian: "петь" },
            { german: "basteln", russian: "мастерить, делать поделки" },
            { german: "tanzen", russian: "танцевать" },
            { german: "kochen", russian: "готовить (еду)" },
            { german: "sagen", russian: "говорить, сказать" },
            { german: "das Wochenende", russian: "выходные, конец недели" },
            { german: "sehen, er sieht", russian: "видеть, смотреть" },
            { german: "mitkommen", russian: "идти вместе, пойти с кем-то" },
            { german: "abholen", russian: "забирать, встречать (кого-то)" },
            { german: "mitspielen", russian: "играть вместе, присоединиться к игре" }
        ];

        let currentIndex = 0;
        let isFlipped = false;

        function updateCard() {
            document.getElementById('german-word').textContent = words[currentIndex].german;
            document.getElementById('russian-word').textContent = words[currentIndex].russian;
            updateProgress();
            
            // Reset flip state
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            const flashcard = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            
            if (isFlipped) {
                flashcard.classList.add('flipped');
            } else {
                flashcard.classList.remove('flipped');
            }
        }

        function nextCard() {
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }

        function previousCard() {
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }

        function shuffleCards() {
            for (let i = words.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [words[i], words[j]] = [words[j], words[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function resetProgress() {
            currentIndex = 0;
            updateCard();
        }

        function updateProgress() {
            const progressText = document.getElementById('progress-text');
            const progressFill = document.getElementById('progress-fill');
            
            progressText.textContent = `${currentIndex + 1} / ${words.length}`;
            const percentage = ((currentIndex + 1) / words.length) * 100;
            progressFill.style.width = percentage + '%';
        }

        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    previousCard();
                    break;
                case 'ArrowRight':
                case ' ':
                    e.preventDefault();
                    nextCard();
                    break;
                case 'Enter':
                case 'ArrowUp':
                case 'ArrowDown':
                    e.preventDefault();
                    flipCard();
                    break;
            }
        });

        // Initialize
        updateCard();
    </script>
</body>
</html>
